<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Civil infrastructure: building and bridge">
  <rect width="600" height="400" fill="#eef2f6"/>
  <!-- water -->
  <rect x="0" y="330" width="600" height="70" fill="#cfd8e1"/>
  <!-- bridge deck -->
  <rect x="300" y="250" width="300" height="12" fill="#4d5863"/>
  <path d="M300 262 Q 380 200 460 262" fill="none" stroke="#6b7785" stroke-width="6"/>
  <g stroke="#9fb4c8" stroke-width="2">
    <line x1="340" y1="250" x2="340" y2="235"/><line x1="380" y1="250" x2="380" y2="222"/>
    <line x1="420" y1="250" x2="420" y2="222"/><line x1="460" y1="250" x2="460" y2="235"/>
  </g>
  <rect x="290" y="262" width="20" height="68" fill="#4d5863"/>
  <rect x="490" y="262" width="20" height="68" fill="#4d5863"/>
  <!-- building -->
  <rect x="70" y="120" width="180" height="210" fill="#1f3b57"/>
  <rect x="100" y="60" width="120" height="60" fill="#2c4f72"/>
  <g fill="#9fb4c8">
    <rect x="95" y="150" width="28" height="28"/><rect x="145" y="150" width="28" height="28"/><rect x="195" y="150" width="28" height="28"/>
    <rect x="95" y="210" width="28" height="28"/><rect x="145" y="210" width="28" height="28"/><rect x="195" y="210" width="28" height="28"/>
  </g>
  <rect x="140" y="280" width="40" height="50" fill="#e07a3f"/>
  <!-- crane hook -->
  <line x1="270" y1="30" x2="270" y2="130" stroke="#e07a3f" stroke-width="5"/>
  <line x1="220" y1="30" x2="330" y2="30" stroke="#e07a3f" stroke-width="5"/>
</svg>
