<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project schedule chart">
  <rect width="600" height="400" fill="#ffffff"/>
  <!-- grid -->
  <g stroke="#e0e6ec" stroke-width="1">
    <line x1="40" y1="60" x2="580" y2="60"/><line x1="40" y1="110" x2="580" y2="110"/>
    <line x1="40" y1="160" x2="580" y2="160"/><line x1="40" y1="210" x2="580" y2="210"/>
    <line x1="40" y1="260" x2="580" y2="260"/><line x1="40" y1="310" x2="580" y2="310"/>
    <line x1="40" y1="360" x2="580" y2="360"/>
    <line x1="160" y1="40" x2="160" y2="370"/><line x1="290" y1="40" x2="290" y2="370"/>
    <line x1="420" y1="40" x2="420" y2="370"/>
  </g>
  <!-- header -->
  <g fill="#6b7785" font-family="Georgia, serif" font-size="13">
    <text x="160" y="32">Q1</text><text x="290" y="32">Q2</text><text x="420" y="32">Q3</text><text x="500" y="32">Q4</text>
  </g>
  <!-- tasks -->
  <rect x="50" y="72" width="200" height="24" rx="3" fill="#1f3b57"/>
  <rect x="120" y="122" width="250" height="24" rx="3" fill="#2c4f72"/>
  <rect x="200" y="172" width="180" height="24" rx="3" fill="#6b7785"/>
  <rect x="300" y="222" width="230" height="24" rx="3" fill="#9fb4c8"/>
  <rect x="380" y="272" width="170" height="24" rx="3" fill="#e07a3f"/>
  <rect x="470" y="322" width="100" height="24" rx="3" fill="#1f3b57"/>
  <!-- milestone -->
  <polygon points="560,350 572,362 560,374 548,362" fill="#e07a3f"/>
</svg>
